name: Build Games

# GitHub Pages menyajikan isi branch apa adanya ("Deploy from a branch"),
# jadi hasil build ikut disimpan di repo: apps/arena → akar situs, apps/mahjong → /mahjong.
# Workflow ini mem-build ulang keduanya dan meng-commit hasilnya bila berbeda,
# misalnya setelah kode diedit langsung lewat web GitHub.
on:
  push:
    paths:
      - 'apps/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/*/package-lock.json
      - name: Build
        env:
          VITE_PEER_HOST: ${{ vars.VITE_PEER_HOST }}
          VITE_PEER_PORT: ${{ vars.VITE_PEER_PORT }}
          VITE_PEER_PATH: ${{ vars.VITE_PEER_PATH }}
        run: |
          # Variabel yang tidak diisi dihapus supaya hasil build sama persis dengan build lokal
          for v in VITE_PEER_HOST VITE_PEER_PORT VITE_PEER_PATH; do [ -z "${!v}" ] && unset "$v"; done
          for app in arena mahjong; do (cd apps/$app && npm ci && npm run build); done
      - name: Commit hasil build bila berubah
        run: |
          HASIL="mahjong index.html assets-arena arena-ikon sw.js manifest.webmanifest"
          if [ -n "$(git status --porcelain $HASIL)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A $HASIL
            git commit -m "Build ulang situs dari apps/"
            git push
          else
            echo "Hasil build sudah sesuai."
          fi
