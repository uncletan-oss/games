name: GitHub Pages

# Build client Mahjong untuk GitHub Pages. Deploy hanya dari branch default.
# Isi repository variable GAS_URL (Settings → Secrets and variables → Actions → Variables)
# dengan URL Web App Apps Script (.../exec). Tanpa GAS_URL, situs berjalan dalam mode lokal.
on:
  push:
    paths:
      - 'mahjong/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mahjong/package-lock.json
      - name: Build
        working-directory: mahjong
        env:
          VITE_GAS_URL: ${{ vars.GAS_URL }}
        run: |
          npm ci
          npm run build:pages
      - name: Susun situs
        run: |
          mkdir -p _site/mahjong
          cp mahjong/dist-pages/index.html _site/mahjong/index.html
          # Halaman utama repo langsung mengarah ke game Mahjong
          printf '<!DOCTYPE html><meta charset="utf-8"><title>Games</title><meta http-equiv="refresh" content="0; url=mahjong/"><a href="mahjong/">Meja Mahjong</a>\n' > _site/index.html
      - uses: actions/upload-pages-artifact@v3

  deploy:
    if: github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}mahjong/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
